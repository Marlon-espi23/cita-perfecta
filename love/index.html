<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuestra Cita Ideal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <audio id="bg-music" src="cancion.mp3" loop></audio>

    <!-- ETAPA 1: LA PREGUNTA INICIAL -->
    <section class="step is-active" id="game-screen">
        <h2>¿Quieres salir conmigo?</h2>
        <div class="buttons-container">
            <button id="yes" style="--grow: 1;">Sí</button>
            <button id="no" onmouseover="dodge()">No</button>
        </div>
    </section>

    <!-- ETAPA 2: CUÁNDO (CALENDARIO) -->
    <section class="step hidden" id="step-2">
        <h2>¿Qué día estás libre? 📅</h2>
        <div class="calendar-container">
            <input type="date" id="date-picker">
            <button id="confirm-date-btn">Confirmar Fecha</button>
        </div>
    </section>

    <!-- ETAPA 3: QUÉ HACER (PLAN) -->
    <section class="step hidden" id="step-3">
        <h2>¿Cuál sería el plan ideal? 🎬</h2>
        <div class="options-grid">
            <button class="next-btn" data-detail="Ir al Cine">Ir al Cine 🍿</button>
            <button class="next-btn" data-detail="Cita de Picnic">Un Picnic 🧺</button>
            <button class="next-btn" data-detail="Pasear/Hablar">Pasear y Hablar ✨</button>
        </div>
    </section>

    <!-- ETAPA 4: QUÉ COMER (COMIDA) -->
    <section class="step hidden" id="step-4">
        <h2>¿Y qué te gustaría comer? 🍕</h2>
        <div class="options-grid">
            <button class="next-btn" data-detail="Pizzas">Pizzas 🍕</button>
            <button class="next-btn" data-detail="Hamburguesas">Hamburguesas 🍔</button>
            <button class="next-btn" data-detail="Helado/Postre">Helado y Postre 🍦</button>
        </div>
    </section>

    <!-- ETAPA FINAL: RESUMEN DE LA CITA -->
    <div id="card-screen" class="hidden">
        <div class="card">
            <div class="heart-icon">❤️</div>
            <h3>¡Tenemos una cita! 🥰</h3>
            <p>Todo listo para nuestro plan. Aquí tienes el resumen:</p>
            <div class="summary-box">
                <p>📅 <strong>Día:</strong> <span id="summary-date">-</span></p>
                <p>🎬 <strong>Plan:</strong> <span id="summary-plan">-</span></p>
                <p>🍕 <strong>Comida:</strong> <span id="summary-food">-</span></p>
            </div>
            
            <!-- ENLACE DE WHATSAPP DIRECTO Y PRE-DIRECCIONADO -->
            <a id="whatsapp-btn" href="https://wa.me" style="text-decoration: none;">
                Enviar cita
            </a>
            
            <p class="final-msg">Prepara tu mejor outfit. ¡Te quiero muchísimo! ✨</p>
        </div>
    </div>

    <script>
        const yes = document.getElementById('yes');
        const no = document.getElementById('no');
        const music = document.getElementById('bg-music');
        const datePicker = document.getElementById('date-picker');
        const confirmDateBtn = document.getElementById('confirm-date-btn');

        let choices = { date: '', plan: '', food: '' };
        let currentStep = 1;
        let dodges = 0;

        function LINES(intentos) {
            const respuestas = ["¿Segura? 🥺", "Piénsalo bien... 👀", "¿De verdad no? 💔", "¡Intenta otra vez!", "Ni lo sueñes 🤭", "¡Ya dile que sí! 🥰"];
            return respuestas[Math.min(intentos - 1, respuestas.length - 1)];
        }

        function dodge() {
            dodges++;
            no.textContent = LINES(dodges);
            if (yes) yes.style.setProperty('--grow', 1 + dodges * 0.45); 

            const x = Math.random() * (window.innerWidth - 140);
            const y = Math.random() * (window.innerHeight - 45);
            no.style.position = "fixed";
            no.style.left = "0px";
            no.style.top = "0px";
            no.style.transform = "translate(" + x + "px, " + y + "px) scale(" + Math.max(0.5, 1 - dodges * 0.05) + ")";
        }

        if (yes) {
            yes.addEventListener('click', function() {
                if (music) music.play().catch(function(e) { console.log("Audio en espera"); });
                document.getElementById('game-screen').classList.add('hidden');
                currentStep = 2;
                document.getElementById('step-2').classList.remove('hidden');
            });
        }

        if (datePicker) {
            const ahora = new Date();
            const anio = ahora.getFullYear();
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const dia = String(ahora.getDate()).padStart(2, '0');
            const fechaLocal = anio + "-" + mes + "-" + dia;
            
            datePicker.min = fechaLocal;
            datePicker.value = fechaLocal;
        }

        if (confirmDateBtn && datePicker) {
            confirmDateBtn.addEventListener('click', function() {
                if (!datePicker.value) {
                    alert("Por favor, selecciona una fecha 🥺");
                    return;
                }
                // CORREGIDO: Formato de fecha reconstruido de manera exacta
                const partes = datePicker.value.split('-');
                choices.date = partes[2] + "/" + partes[1] + "/" + partes[0];

                document.getElementById('step-2').classList.add('hidden');
                currentStep = 3;
                document.getElementById('step-3').classList.remove('hidden');
            });
        }

        document.querySelectorAll('.next-btn').forEach(function(button) {
            button.addEventListener('click', function(e) {
                const selection = e.currentTarget.getAttribute('data-detail');
                
                if (currentStep === 3) {
                    choices.plan = selection;
                    document.getElementById('step-3').classList.add('hidden');
                    currentStep = 4;
                    document.getElementById('step-4').classList.remove('hidden');
                } else if (currentStep === 4) {
                    choices.food = selection;
                    document.getElementById('step-4').classList.add('hidden');
                    currentStep = 5;
                    showFinalCard(); 
                }
            });
        });

        function showFinalCard() {
            document.getElementById('summary-date').textContent = choices.date;
            document.getElementById('summary-plan').textContent = choices.plan;
            document.getElementById('summary-food').textContent = choices.food;
            
           const mensaje = "¡Hola! 💕 Ya armé el itinerario para nuestra próxima salida especial. MIRA LO QUE ELEGI:\n\n" +
                            "✨ 📅 *Fecha:* " + choices.date + "\n" +
                            "✨ 🎬 *Actividad:* " + choices.plan + "\n" +
                            "✨ 🍔 *Cena:* " + choices.food + "\n\n" +
                            "¡Gracias por invitarme a salir! Te quiero muchísimo! 🥰🚀❤️";
            
            const whatsappBtn = document.getElementById('whatsapp-btn');
            if (whatsappBtn) {
                whatsappBtn.href = "https://wa.me?text=" + encodeURIComponent(mensaje);
            }

            document.getElementById('card-screen').classList.remove('hidden');
            setInterval(createHeart, 200);
        }

        function createHeart() {
            const heart = document.createElement('span');
            heart.textContent = '❤️';
            heart.classList.add('floating-heart');
            heart.style.left = (Math.random() * 100) + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's'; 
            document.body.appendChild(heart);
            setTimeout(function() { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
